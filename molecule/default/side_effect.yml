---
# Roundcube is a mail client: on its own it renders a login page and nothing
# else. To test anything past that page there has to be a mail server to log
# into, so the scenario starts a throwaway one on the role's own container
# network, after the role has created that network during converge.
- name: Start the IMAP helper for Roundcube Molecule tests
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the checks shared by all Roundcube scenarios
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/side_effect_tasks.yml"
