---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: roundcube-${MOLECULE_DISTRO:-ubuntu2604}-postgres
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        roundcube_debug_service_enabled: false

        # Variables for Roundcube
        roundcube_uid: www-data
        roundcube_gid: www-data
        roundcube_hostname: localhost
        roundcube_container_labels_traefik_enabled: false
        roundcube_container_http_host_bind_port: 8000
        # Molecule's side-effect and verify plays run outside the role and so do
        # not see its defaults. These two are restated here because both plays
        # need to name the container and the network that the role creates.
        roundcube_container_network: roundcube

        # A throwaway mail server that the tests log into through Roundcube. It
        # runs on the role's own container network, so Roundcube reaches it by
        # container name through Docker's embedded DNS. Plaintext IMAP/SMTP on
        # purpose: the helper's TLS ports present a self-signed certificate that
        # Roundcube would rightly refuse.
        roundcube_molecule_imap_helper_image: docker.io/greenmail/standalone:2.1.7
        roundcube_molecule_imap_helper_container_name: roundcube-molecule-postgres-imap
        roundcube_molecule_imap_helper_imap_port: 3143
        roundcube_molecule_imap_helper_smtp_port: 3025
        roundcube_molecule_imap_helper_username: molecule
        roundcube_molecule_imap_helper_password: molecule-password

        roundcube_environment_variables_default_imap_host: "{{ roundcube_molecule_imap_helper_container_name }}"
        roundcube_environment_variables_default_imap_port: "{{ roundcube_molecule_imap_helper_imap_port }}"
        roundcube_environment_variables_smtp_server: "{{ roundcube_molecule_imap_helper_container_name }}"
        roundcube_environment_variables_smtp_port: "{{ roundcube_molecule_imap_helper_smtp_port }}"

        # Variables required for Roundcube to connect to the Postgres database (via Unix socket)
        roundcube_database_type: postgres
        roundcube_database_postgres_username: my_database_username
        roundcube_database_postgres_password: my_database_password
        roundcube_database_name: roundcube
        roundcube_database_postgres_socket_enabled: true
        roundcube_database_postgres_socket_path_host: "{{ postgres_run_path }}"
        roundcube_systemd_required_services_list_auto: |
          {{
            (['postgres.service'])
          }}

        # Variables for Postgres
        postgres_uid: 1000
        postgres_gid: 1000
        postgres_connection_password: postgres_password
        postgres_container_unix_socket_enabled: true
        postgres_managed_databases: |
          {{
            [{
              'name': roundcube_database_name,
              'username': roundcube_database_postgres_username,
              'password': roundcube_database_postgres_password,
            }]
          }}
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-postgres
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
