---
- name: Verify Roundcube
  hosts: all
  become: true
  gather_facts: false

  vars:
    roundcube_verify_base_url: "http://localhost:{{ roundcube_container_http_host_bind_port }}"

    roundcube_verify_units:
      - roundcube.service
      - mariadb.service

  tasks:
    - name: Verify that Roundcube works
      block:
        - name: Run the shared Roundcube verification
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Roundcube systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=roundcube.service
          register: roundcube_service_log
          changed_when: false

        - name: Show the Roundcube systemd service log
          ansible.builtin.debug:
            var: roundcube_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Roundcube verification failed. The systemd service log is printed above."
